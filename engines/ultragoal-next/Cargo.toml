[package]
name = "ultragoal-next-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "ultragoal"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
libc = "=0.2.186"
syn = { version = "=2.0.117", features = ["full"] }
