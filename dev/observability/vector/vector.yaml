api:
  enabled: true
  address: 0.0.0.0:8686

data_dir: /var/lib/vector

sources:
  ultragoal_spool:
    type: file
    include:
      - /spool/events.jsonl
    read_from: beginning
    ignore_older_secs: 86400

transforms:
  bounded_ultragoal:
    type: remap
    inputs:
      - ultragoal_spool
    source: |
      .stream = "ultragoal"
      .message = string!(.message)

sinks:
  victorialogs:
    type: http
    inputs:
      - bounded_ultragoal
    uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=stream,command,law_id,check_id,claim_id,candidate_digest&_msg_field=message&_time_field=timestamp"
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      timeout_secs: 5
      retry_attempts: 3
