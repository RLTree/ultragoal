# Harness Ultragoal orchestrator idle heartbeat contract.
# Copy this file into a target repo automation surface and replace all
# __PLACEHOLDER__ values before enabling it.

automation_id = "__ULTRAGOAL_AUTOMATION_ID__"
name = "Harness Ultragoal Orchestrator Heartbeat"
kind = "heartbeat"
status = "disabled_until_bound"
cadence = "every 30 minutes"
timezone = "__TIMEZONE__"

target_thread_id = "__ORCHESTRATOR_THREAD_ID__"
goal_id = "__GOAL_ID__"
repo_root = "__REPO_WORKSPACE_ROOT__"
lane_registry_path = "LANE_REGISTRY.json"
active_execplan_dir = "docs/exec-plans/active"
verification_backlog_path = "VERIFICATION_BACKLOG.json"
completion_manifest_path = "COMPLETION_MANIFEST.json"
automation_tick_receipt_path = "validation_artifacts/automation/ultragoal-orchestrator-tick.json"

source_artifact_path = ".codex/automations/ultragoal-orchestrator/automation.toml"
prompt_artifact_path = ".codex/automations/ultragoal-orchestrator/prompt.md"
prompt_digest = "__PROMPT_DIGEST_SHA256__"

package_source_path = "__SOURCE_PLUGIN_OR_PACKAGE_PATH__"
installed_plugin_path = "__INSTALLED_PLUGIN_PATH_OR_NA__"
cache_package_path = "__CACHE_PACKAGE_PATH_OR_NA__"
install_surface_claim_ceiling = "unsupported_without_same_surface_receipts"

[mutation_authority]
default = "read_only"
allowed_actions = [
  "send_one_steer_message_within_existing_scope",
  "record_tick_receipt",
  "update_automation_cadence_when_contract_allows"
]
requires_escalation = [
  "destructive_file_action",
  "scope_change",
  "new_lane_creation_not_already_unblocked",
  "package_or_cache_mutation",
  "raw_private_artifact_access"
]

[evidence_cursors]
goal_contract = "GOAL_CONTRACT.md"
lane_session = "LANE_REGISTRY.json"
repo_artifact = "validation_artifacts/"
automation_thread = "validation_artifacts/automation/ultragoal-orchestrator-tick.json"
changed_receipts = "validation_artifacts/"

[output_contract]
allowed_statuses = ["DONT_NOTIFY", "STEER", "ESCALATE"]
default_status = "DONT_NOTIFY"
material_delta_required_for_notification = true

[freshness_policy]
max_tick_age_minutes = 45
max_success_age_minutes = 180
