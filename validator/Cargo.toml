[package]
name = "ultragoal"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["error-context", "help", "std", "usage"] }
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde", "std"] }
walkdir = "2.5.0"

[[bin]]
name = "ultragoal"
path = "src/bin/ultragoal.rs"
