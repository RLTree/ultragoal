[package]
name = "ultragoal-validator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
walkdir = "2.5.0"

[[bin]]
name = "ultragoal-validator"
path = "src/bin/ultragoal-validator.rs"

[[bin]]
name = "ultragoal"
path = "src/bin/ultragoal.rs"
