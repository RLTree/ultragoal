lane_objective_standard = "Every new lane must get falsifiable product-behavior objectives with positive proof, negative falsification cases, source inspection, old-surface retirement or routing, parent acceptance reruns, and explicit claim ceiling."
lane_objective_v2_standard = "Every active custom-tooling lane must carry executable behavior rows: primary positive product behavior, cache/reuse legality, failure preservation, old-surface retirement or routing, and claim-ceiling enforcement. Each row needs exact command/API, input authorities, expected output fields, independent reconciliation, positive proof, negative falsification, source inspection, old-surface disposition, parent rerun, and explicit unsupported claims."
lane_objective_v3_standard = "Every active send-back and future custom-tooling lane must carry a verification packet with: done_claim, not_claimed, acceptance_table, falsification_table, old_surface_table, reviewer_questions, and parent_rerun_plan. The owner, reviewer, and parent must be able to mark each row pass, partial, or blocked from exact commands, source guards, digests, and claim ceilings."
lane_objective_packet_standard = "Before lane work or send-back steering, give the owner a packet with: one product-behavior objective, owned and forbidden authority, explicit behavior rows, positive current-candidate product proof or verified current-input reuse, negative false-pass proof, independent reconciliation, old-surface disposition, reviewer packet, parent reruns, remaining blocker movement, and explicit claim ceiling."

[lane_completion_contract]
purpose = "Give lane owners yes/no objectives that prove product behavior and expose false positives before parent acceptance."
objective_quality_gate = [
  "a lane objective is not launchable unless it can be evaluated as pass, partial, or blocked from explicit commands and source paths",
  "each objective states product behavior as: when an agent runs this command or edits this input, Harness returns this validation, cache, telemetry, repair, or claim-ceiling behavior",
  "each objective names the old behavior to retire, route through the new authority, or keep only as a typed compatibility surface with a sunset rule",
  "each objective includes at least one positive current-candidate run and one negative falsification run or focused fixture for every changed authority",
  "each objective names the exact parent-visible blocker that should move if the lane succeeds and the exact downstream blocker that may remain outside lane ownership"
]
acceptance_matrix_required_columns = [
  "behavior_id",
  "product_behavior",
  "owned_command_or_api",
  "required_inputs",
  "expected_stdout_or_receipt_fields",
  "proof_kind: executed | verified_cache_hit | explicit_blocker",
  "independent_reconciliation_surface",
  "negative_falsification_case",
  "old_surface_retirement_or_routing",
  "parent_rerun",
  "claim_ceiling"
]
completion_state_definitions = [
  "pass means the named product behavior works on the lane current candidate, required falsification fails closed, old surfaces are retired or routed, and the lane has a clean source-local/not-readiness commit",
  "partial means mechanics or source changes exist, but one or more product runs, falsification cases, reconciliation surfaces, or old-surface retirement checks are missing",
  "blocked means the lane cannot proceed without a parent-owned path, unavailable tool, explicit product decision, or external state; the final report must name the smallest unblock action"
]
minimum_falsification_library = [
  "stale_or_wrong_digest_rejected",
  "wrong_command_identity_rejected",
  "input_scope_mismatch_rejected",
  "result_or_output_digest_mismatch_rejected",
  "cache_hit_false_without_execution_rejected",
  "work_unit_zero_without_verified_reuse_rejected",
  "validation_result_not_promoted_to_speed_or_observability_claim",
  "row_shape_or_generated_output_only_rejected",
  "old_surface_bypass_rejected_or_routed",
  "forbidden_claim_surface_rejected"
]
lane_owner_done_only_when = [
  "the lane names the exact product behavior changed and the exact old behavior replaced, routed, or intentionally left with a typed compatibility limit",
  "every changed path maps to a product role and no changed path is outside the lane contract without stop-and-parent-approval evidence",
  "the lane demonstrates at least one positive current-candidate product run for the claimed behavior, or verified current-input reuse with explicit routine-only claim limits",
  "the lane demonstrates negative falsification for stale or wrong digest, wrong command identity, wrong input scope, mismatched result/output digest, proof-promotion mismatch, and row-shape or proxy pass",
  "the lane provides an acceptance matrix row for each product behavior it claims and marks each row pass, partial, or blocked with an exact reason",
  "the lane separates validation result, production proof, observability proof, speed proof, and claim ceiling",
  "the lane records exact commands, exit statuses, current digest, changed files, result/output digests where applicable, and the first remaining blocker after repair",
  "the lane leaves a clean worktree with one source-local/not-readiness commit or a no-delta blocker report naming the parent-owned blocker"
]
parent_rejects_when = [
  "the final report says complete but lacks a real product run or verified current-input reuse",
  "the lane proves parser, unit, schema, generated-row, or local JSON mechanics but not the product behavior named by the objective",
  "the lane omits a negative falsification case for a known high-risk lie surface",
  "the lane preserves an old helper, alias, command, cache, generated surface, or fallback without product-role proof, explicit routing, claim ceiling, and sunset rule",
  "the lane marks Gate 92, Product Usage, Phase 4, readiness, release, completion, install/cache, final packet, registry/reviewer exposure, or update_goal as supported"
]
final_report_required_fields = [
  "objective_result: pass | blocked | partial",
  "product_behavior_observed",
  "replaced_or_routed_surfaces",
  "current_digest",
  "commit",
  "files_changed",
  "validation_commands_and_exit_statuses",
  "production_commands_and_exit_statuses",
  "positive_proof_summary",
  "negative_falsification_summary",
  "source_inspection_notes",
  "acceptance_matrix",
  "remaining_product_blocker",
  "remaining_observability_blocker",
  "remaining_speed_blocker",
  "claim_ceiling",
  "unsupported_claims"
]
lane_objective_v2_rejects = [
  "any required behavior row is missing or collapsed into prose",
  "positive proof is tests-only, generated-row-only, local-json-only, or receipt-existence-only",
  "negative falsification omits the highest-risk lie surface changed by the lane",
  "source inspection does not name the files/functions that implement the claimed authority",
  "old helpers, aliases, broad runners, cache paths, generated surfaces, or fallbacks survive without typed product role, route-through proof, claim ceiling, and sunset rule",
  "parent rerun cannot independently observe blocker movement or legal explicit blocker output"
]
lane_objective_v3_required_sections = [
  "done_claim: one exact source-local product behavior that may be true only if all rows pass",
  "not_claimed: forbidden downstream claims that remain unsupported even if the lane passes",
  "acceptance_table: row_id, state, product behavior, command/API, exit status, required fields, proof_kind, result/output digest, independent reconciliation, parent rerun, expected parent observation, claim ceiling",
  "falsification_table: false-positive risk, why the lane could lie, rejecting test/fixture/command, expected fail-closed signal, source guard function, reviewer question",
  "old_surface_table: old helpers, aliases, broad runners, generated surfaces, cache paths, and fallbacks removed, routed, or kept with typed compatibility and sunset",
  "reviewer_questions: exact files/functions and adversarial questions",
  "parent_rerun_plan: exact commands and expected blocker movement"
]
lane_objective_v3_rejects = [
  "the final report lacks the acceptance table or any row is marked pass without a current-candidate product run, verified current-input reuse, or explicit legal blocker",
  "the falsification table omits a known false-positive risk for the changed authority",
  "old surfaces survive without removed/routed/typed-compatibility disposition",
  "source inspection does not name the functions that enforce the product behavior",
  "reviewer packet lacks adversarial questions tied to the lane's specific lie surfaces",
  "parent rerun plan cannot independently reproduce the claimed blocker movement",
  "unsupported downstream claims are missing or softened"
]
operational_objective_packet_required = [
  "Objective: one product-behavior sentence beginning with When an agent runs... or When an agent edits...",
  "Owned authority: exact commands, APIs, source files, manifests, fixtures, schemas, and old surfaces the lane may change",
  "Forbidden authority: exact paths and claim surfaces the lane must stop before touching",
  "Behavior rows: one row per product behavior, with pass/partial/blocked state and exact proof",
  "Positive proof: at least one real current-candidate product run or verified current-input reuse chain per behavior",
  "Negative proof: the highest-risk false-pass paths for the changed authority fail closed",
  "Independent reconciliation: stdout, receipt, source inspection, result/output digest, telemetry, or current-state surface that confirms the product behavior",
  "Old-surface disposition: removed, routed through new authority, or kept only as typed compatibility with claim ceiling and sunset",
  "Reviewer packet: exact files/functions to inspect and adversarial questions the reviewer must answer",
  "Parent acceptance: exact commands the parent reruns and blocker movement expected after merge"
]
send_back_rule = "If a lane final report lacks any required behavior row, positive product run or verified reuse chain, negative falsification, old-surface disposition, reviewer packet, or claim-ceiling row, send it back with the missing row names instead of accepting the lane."
v3_send_back_rule = "If a lane final report lacks any V3 acceptance-table row, falsification-table row, old-surface disposition, reviewer question, parent rerun command, expected parent observation, or unsupported-claims row, send it back by naming the missing row ids and false-positive risks."

