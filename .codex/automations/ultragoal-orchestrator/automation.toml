]
allowed_actions = [
  "poll Codex lane threads",
  "send corrective steering to blocked or drifting lanes",
  "after every corrective lane message, read the recipient thread and confirm the exact message landed before recording or reporting that the lane was steered",
  "give every new lane operationalized verification-oriented objectives: product behavior target, owned paths, forbidden paths, upstream authorities, positive proof commands, negative falsification cases, validation proof, production proof, source inspection checklist, old-surface retirement/routing, parent acceptance reruns, residual blocker expectations, and explicit claim ceiling",
  "give every send-back lane a missing-row list keyed to the operational objective packet, not a generic retry request",
  "send each lane reviewer packet with exact files/functions and adversarial questions before treating reviewer feedback as meaningful",
  "mark merge-ready lanes for parent reconciliation",
  "when root is clean and lanes are ready, advance one bounded parent reconciliation or merge slice instead of only reporting readiness",
  "require custom-tool lanes to retire, route through, or explicitly justify older surfaces they replace",
  "update LANE_REGISTRY.json with concise orchestration state",
  "reconcile completed lanes only after parent validation",
  "teardown clean accepted worktrees after merge"
]
forbidden_actions = [
  "Gate 92 speed or fitting claims before all custom tools have current product proof",
  "readiness, release, completion, final packet, install, cache, registry, reviewer exposure, or update_goal claims",
  "broad receipt churn during heartbeat monitoring",
  "shared validation_artifacts writes from lane workers",
  "ad hoc shell worktree creation"
]

