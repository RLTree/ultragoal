lane_objective_standard = "Every new lane must get falsifiable product-behavior objectives with positive proof, negative falsification cases, source inspection, old-surface retirement or routing, parent acceptance reruns, and explicit claim ceiling."

[lane_completion_contract]
purpose = "Give lane owners yes/no objectives that prove product behavior and expose false positives before parent acceptance."
lane_owner_done_only_when = [
  "the lane names the exact product behavior changed and the exact old behavior replaced, routed, or intentionally left with a typed compatibility limit",
  "every changed path maps to a product role and no changed path is outside the lane contract without stop-and-parent-approval evidence",
  "the lane demonstrates at least one positive current-candidate product run for the claimed behavior, or verified current-input reuse with explicit routine-only claim limits",
  "the lane demonstrates negative falsification for stale or wrong digest, wrong command identity, wrong input scope, mismatched result/output digest, proof-promotion mismatch, and row-shape or proxy pass",
  "the lane separates validation result, production proof, observability proof, speed proof, and claim ceiling",
  "the lane records exact commands, exit statuses, current digest, changed files, result/output digests where applicable, and the first remaining blocker after repair",
  "the lane leaves a clean worktree with one source-local/not-readiness commit or a no-delta blocker report naming the parent-owned blocker"
]
parent_rejects_when = [
  "the final report says complete but lacks a real product run or verified current-input reuse",
  "the lane proves parser, unit, schema, generated-row, or local JSON mechanics but not the product behavior named by the objective",
  "the lane omits a negative falsification case for a known high-risk lie surface",
  "the lane preserves an old helper, alias, command, cache, generated surface, or fallback without product-role proof, explicit routing, claim ceiling, and sunset rule",
  "the lane marks Gate 92, Product Usage, Phase 4, readiness, release, completion, install/cache, final packet, registry/reviewer exposure, or update_goal as supported"
]
final_report_required_fields = [
  "objective_result: pass | blocked | partial",
  "product_behavior_observed",
  "replaced_or_routed_surfaces",
  "current_digest",
  "commit",
  "files_changed",
  "validation_commands_and_exit_statuses",
  "production_commands_and_exit_statuses",
  "positive_proof_summary",
  "negative_falsification_summary",
  "source_inspection_notes",
  "remaining_product_blocker",
  "remaining_observability_blocker",
  "remaining_speed_blocker",
  "claim_ceiling",
  "unsupported_claims"
]

[cadence]
kind = "heartbeat"
interval_minutes = 30

[duties]
first_actions = [
  "recompute package digest with target/debug/ultragoal --root . package digest",
  "check git status --short --branch --untracked-files=all",
  "read LANE_REGISTRY.json",
  "classify active lanes by thread, worktree, owned custom tools, dirty paths, and claim ceiling"
]
allowed_actions = [
  "poll Codex lane threads",
  "send corrective steering to blocked or drifting lanes",
  "after every corrective lane message, read the recipient thread and confirm the exact message landed before recording or reporting that the lane was steered",
  "give every new lane operationalized verification-oriented objectives: product behavior target, owned paths, forbidden paths, upstream authorities, positive proof commands, negative falsification cases, validation proof, production proof, source inspection checklist, old-surface retirement/routing, parent acceptance reruns, residual blocker expectations, and explicit claim ceiling",
  "mark merge-ready lanes for parent reconciliation",
  "when root is clean and lanes are ready, advance one bounded parent reconciliation or merge slice instead of only reporting readiness",
  "require custom-tool lanes to retire, route through, or explicitly justify older surfaces they replace",
  "update LANE_REGISTRY.json with concise orchestration state",
  "reconcile completed lanes only after parent validation",
  "teardown clean accepted worktrees after merge"
]
forbidden_actions = [
  "Gate 92 speed or fitting claims before all custom tools have current product proof",
  "readiness, release, completion, final packet, install, cache, registry, reviewer exposure, or update_goal claims",
  "broad receipt churn during heartbeat monitoring",
  "shared validation_artifacts writes from lane workers",
  "ad hoc shell worktree creation"
]

